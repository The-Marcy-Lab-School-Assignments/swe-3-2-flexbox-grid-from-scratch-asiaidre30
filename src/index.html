<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASIA's Music</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- TOP NAV -->
    <header class="top-nav">
      <img src="img/logo.png" alt="logo" class="logo" />

      <h1 class="site-title">Marcy Music</h1>

      <nav class="nav-links">
        <a href="#">Library</a>
        <a href="#">Explore</a>
        <a href="#">Profile</a>
      </nav>
    </header>

    <main class="content">
      <!-- PLAYLISTS -->
      <section class="playlists">
        <h2>Playlists</h2>

        <div class="playlist-grid">
          <div class="playlist-card">
            <img src="img/playlist-focus.jpg" />
            <span>Chill Vibes</span>
          </div>

          <div class="playlist-card">
            <img src="img/playlist-late-night.jpg" />
            <span>Focus</span>
          </div>

          <div class="playlist-card">
            <img src="img/playlist-sad.jpg" />
            <span>Late Night</span>
          </div>

          <div class="playlist-card">
            <img src="img/playlist-love.jpg" />
            <span>Love Songs</span>
          </div>

          <div class="playlist-card">
            <img src="img/album-midnight-dreams.jpg" />
            <span>Oldies</span>
          </div>

          <div class="playlist-card">
            <img src="img/album-golden-hour.jpg" />
            <span>Sad</span>
          </div>
        </div>
      </section>

      <!-- ALBUMS -->
      <section class="albums">
        <h2>Albums</h2>

        <div class="album-grid">
          <div class="album-card">
            <img src="img/album-midnight-dreams.jpg" />
            <p class="album-title">Midnight Dreams</p>
            <p class="album-artist">Luna Ray</p>
          </div>

          <div class="album-card">
            <img src="img/playlist-focus.jpg" />
            <p class="album-title">Electric Soul</p>
            <p class="album-artist">The Voltage</p>
          </div>

          <div class="album-card">
            <img src="img/album-kermit-does-jazz.jpg" />
            <p class="album-title">Golden Hour</p>
            <p class="album-artist">Sunset Collective</p>
          </div>

          <div class="album-card">
            <img src="img/album-electric-soul.jpg" />
            <p class="album-title">Laughter</p>
            <p class="album-artist">Kermit the Frog</p>
          </div>
        </div>
      </section>
    </main>

    <footer>Made with ASI 💚 from Marcy Lab School</footer>
  </body>
</html>
